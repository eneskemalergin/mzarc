name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.16.0
        run: |
          ZIG_VERSION=0.16.0
          case "$RUNNER_OS" in
            Linux) OS=linux ;;
            macOS) OS=macos ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   ARCH=x86_64 ;;
            ARM64) ARCH=aarch64 ;;
          esac
          TARBALL="zig-${OS}-${ARCH}-${ZIG_VERSION}.tar.xz"
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" | tar xJ
          echo "$PWD/zig-${OS}-${ARCH}-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Build
        run: zig build -Drelease=true

      - name: Unit tests
        run: zig build test

      - name: Fixture integrity
        run: zig build check-fixture

      - name: Codec roundtrips and adversarial
        run: bash tools/smoke_test.sh
